<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J'y Serai – Plateforme d'affiches événementielles</title>
  <meta name="description" content="J'y Serai — Générez votre affiche personnalisée de participation à un événement.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 10% 20%, #FFF5FA 0%, #E0F2FE 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1E293B;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .logo {
      width: 120px;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 4px 16px rgba(226,0,122,0.15);
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #E2007A;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748B;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: linear-gradient(135deg, #E2007A, #00A1C9);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(226,0,122,0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(226,0,122,0.4);
    }
    .footer {
      margin-top: 3rem;
      color: #94A3B8;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="assets/images/logo-arif-cropped.jpg" alt="Logo ARIF">
    <h1>J'y Serai</h1>
    <p>Plateforme de génération d'affiches personnalisées pour les événements ARIF.</p>
    <a class="btn" href="/assets/pages/index.html">
      Générer mon affiche →
    </a>
    <div class="footer">
      <p>&copy; 2026 ARIF — Association pour la Réussite et l'Insertion des Femmes</p>
    </div>
  </div>
</body>
</html>
