<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Admin — J'y Serai (usage unique)</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-size: 1.2rem; font-weight: 700; color: #E2007A; margin-bottom: 8px; }
    p  { font-size: 0.85rem; color: #94A3B8; margin-bottom: 20px; line-height: 1.5; }
    .warning {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #FCA5A5;
      margin-bottom: 20px;
    }
    label { display: block; font-size: 0.8rem; color: #94A3B8; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 0.875rem;
      margin-bottom: 14px;
      outline: none;
    }
    input:focus { border-color: #E2007A; }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #E2007A, #B5005E);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      display: none;
    }
    .success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #6EE7B7; white-space: pre-wrap; line-height: 1.5; }
    .error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #FCA5A5; white-space: pre-wrap; line-height: 1.5; }
    .warning-card { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); color: #FCD34D; white-space: pre-wrap; line-height: 1.6; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔑 Création du compte Administrateur</h1>
    <p>Ce script crée un compte Firebase Auth et le document <code>admins/{uid}</code> correspondant dans Firestore. À utiliser UNE SEULE FOIS.</p>

    <div class="warning">
      ⚠️ Supprimez ce fichier après utilisation ou ne le déployez jamais en production.
    </div>

    <label for="seed-name">Nom complet</label>
    <input type="text" id="seed-name" placeholder="Ex: Fatoumata Diallo" value="">

    <label for="seed-email">E-mail administrateur</label>
    <input type="email" id="seed-email" placeholder="admin@arif.sn" value="">

    <label for="seed-pass">Mot de passe (min 8 caractères)</label>
    <input type="password" id="seed-pass" placeholder="Choisissez un mot de passe fort" value="">

    <label for="seed-role">Rôle</label>
    <select id="seed-role" style="width:100%;padding:10px 12px;background:rgba(255,255,255,0.07);border:1.5px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:0.875rem;margin-bottom:14px;">
      <option value="super_admin">super_admin</option>
      <option value="admin">admin</option>
      <option value="editor">editor</option>
    </select>

    <button id="btn-seed">Créer / Configurer l'administrateur</button>

    <div id="result"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script>
    const firebaseConfig = {
      projectId:         'arif-event-card',
      appId:             '1:260697604272:web:a3a164579b057ea25d7b75',
      storageBucket:     'arif-event-card.firebasestorage.app',
      apiKey:            'AIzaSyByEBDcf9idUpInhgeQ-9eY-is9eFPBa6M',
      authDomain:        'arif-event-card.firebaseapp.com',
      messagingSenderId: '260697604272'
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db   = firebase.firestore();
    const auth = firebase.auth();

    document.getElementById('btn-seed').addEventListener('click', async () => {
      const name  = document.getElementById('seed-name').value.trim();
      const email = document.getElementById('seed-email').value.trim();
      const pass  = document.getElementById('seed-pass').value;
      const role  = document.getElementById('seed-role').value;
      const result = document.getElementById('result');
      const btn    = document.getElementById('btn-seed');

      if (!name || !email || !pass) {
        showResult('Veuillez remplir tous les champs.', 'error');
        return;
      }

      if (pass.length < 8) {
        showResult('Le mot de passe doit contenir au moins 8 caractères.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Création en cours...';

      try {
        let uid;

        try {
          // 1. Tenter la connexion (si le compte existe déjà)
          const cred = await auth.signInWithEmailAndPassword(email, pass);
          uid = cred.user.uid;
          if (name) {
            try { await cred.user.updateProfile({ displayName: name }); } catch (e) {}
          }
          console.log('[SeedAdmin] Authentification réussie pour compte existant. UID :', uid);
        } catch (signInErr) {
          if (signInErr.code === 'auth/user-not-found' || signInErr.code === 'auth/invalid-credential' || signInErr.code === 'auth/invalid-email') {
            // Le compte n'existe pas -> Le créer
            console.log('[SeedAdmin] Compte non trouvé. Création dans Firebase Auth...');
            const newCred = await auth.createUserWithEmailAndPassword(email, pass);
            uid = newCred.user.uid;
            if (name) {
              try { await newCred.user.updateProfile({ displayName: name }); } catch (e) {}
            }
            console.log('[SeedAdmin] Compte créé dans Firebase Auth. UID :', uid);
          } else {
            throw signInErr;
          }
        }

        // 2. Tenter d'enregistrer dans Firestore
        let firestoreOk = false;
        try {
          await db.collection('admins').doc(uid).set({
            uid:         uid,
            email:       email,
            displayName: name || email,
            name:        name || email,
            role:        role,
            active:      true,
            createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          firestoreOk = true;
        } catch (fsErr) {
          console.warn('[SeedAdmin] Écriture Firestore bloquée par les règles de sécurité :', fsErr.code);
        }

        if (firestoreOk) {
          showResult(
            `✅ SUCCÈS COMPLET !\n\n• Firebase Authentication : Compte valide\n• UID Firebase : ${uid}\n• Firestore : Document admins/${uid} créé/mis à jour avec succès\n• Rôle : ${role}\n• Statut : Actif\n\n👉 Rendez-vous sur /admin/ pour vous connecter !`,
            'success'
          );
        } else {
          // Les règles Firestore de sécurité interdisent l'écriture client
          showResult(
            `🔑 Compte Firebase Auth validé (UID: ${uid})\n\n⚠️ Cependant, vos règles de sécurité Firestore interdisent la création directe depuis le client (ce qui est normal pour la sécurité).\n\nPour activer ce compte admin, ajoutez ce document dans Firebase Console :\n\n1. Allez sur Firestore Database > Collection "admins"\n2. Cliquez sur "Add document"\n3. Document ID : ${uid}\n4. Ajoutez les champs suivants :\n   - uid (string) : "${uid}"\n   - email (string) : "${email}"\n   - displayName (string) : "${name || email}"\n   - role (string) : "${role}"\n   - active (boolean) : true\n\n👉 Une fois ajouté, vous pourrez vous connecter immédiatement sur /admin/ !`,
            'warning-card'
          );
        }

      } catch (err) {
        console.error('[SeedAdmin] Erreur :', err);
        const msgs = {
          'auth/wrong-password':       'Ce compte existe déjà dans Firebase Auth mais le mot de passe est incorrect.',
          'auth/invalid-credential':   'Identifiants incorrects pour ce compte Firebase existant.',
          'auth/weak-password':        'Mot de passe trop faible (min 8 caractères).',
          'auth/invalid-email':        'Adresse e-mail invalide.'
        };
        showResult('❌ Erreur : ' + (msgs[err.code] || err.message), 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Créer / Configurer l\'administrateur';
      }
    });

    function showResult(msg, type) {
      const el = document.getElementById('result');
      el.style.display = 'block';
      el.className = type;
      el.textContent = msg;
    }
  </script>
</body>
</html>
